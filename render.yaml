services:
  - type: web
    name: multimodal-attendance-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: PORT
        value: 5000
      - key: CORS_ORIGINS
        value: "*"
      - key: FLASK_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
